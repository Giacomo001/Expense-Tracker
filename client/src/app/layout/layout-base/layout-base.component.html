<div class="grid grid-cols-[13.75rem_1fr_13.75rem] h-screen overflow-hidden">
    <!-- SIDEBAR — CATEGORIES -->
    <app-categories
        (categorySelected)="selectedCategoryId.set($event)">
    </app-categories>

    <!-- MAIN -->
    <div class="h-full overflow-y-auto">
        <router-outlet />
    </div>

    <!-- SIDEBAR — CALENDAR -->
    <app-calendar
        (dateSelected)="onDateSelected($event)"
        (monthSelected)="onMonthChanged($event)">
    </app-calendar>
</div>
