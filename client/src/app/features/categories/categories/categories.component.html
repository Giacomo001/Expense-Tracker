  <aside class="bg-white h-full border-r border-gray-200 flex flex-col gap-1 p-3 overflow-y-auto">
    <span class="text-xs text-secondary-light uppercase tracking-widest px-2 mb-2">Categories</span>
    <div (click)="selectedCategoryId.set(null)"
      class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer border text-sm transition-all"
      [class.bg-info-light]="selectedCategoryId() === null"
      [class.border-primary-light]="selectedCategoryId() === null"
      [class.text-primary-dark]="selectedCategoryId() === null"
      [class.font-medium]="selectedCategoryId() === null"
      [class.border-transparent]="selectedCategoryId() !== null"
      [class.text-secondary]="selectedCategoryId() !== null">
      
      <span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color: var(--color-primary)"></span>
      All
      <span class="ml-auto text-xs">€ {{ expensesList() | sum | number:'1.2-2' }}</span>
    </div>

    @for (category of categoriesList(); track category.id) {
      <div (click)="selectedCategoryId.set(category.id)"
        class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer border text-sm transition-all"
        [class.bg-info-light]="selectedCategoryId() === category.id"
        [class.border-primary-light]="selectedCategoryId() === category.id"
        [class.text-primary-dark]="selectedCategoryId() === category.id"
        [class.font-medium]="selectedCategoryId() === category.id"
        [class.border-transparent]="selectedCategoryId() !== category.id"
        [class.text-secondary]="selectedCategoryId() !== category.id">

        <span class="w-2 h-2 rounded-full flex-shrink-0" [style.background-color]="category.color"></span>
        {{ category.name }}
        <span class="ml-auto text-xs">€ {{ expensesList() | sum:category.id | number:'1.2-2' }}</span>
      </div>
    }

    <div class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-secondary-light border border-dashed border-gray-200 mt-2 cursor-pointer">
      <mat-icon class="text-base">add</mat-icon>
      Add category
    </div>
  </aside>
